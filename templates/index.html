<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAIZ | Ateliê de Plantas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</head>
<body>
    <header class="topo">
        <a class="logo" href="/">RAIZ<span>.</span></a>
        <p>Ateliê de Plantas</p>
    </header>
    <main class="container">
        <section class="apresentacao">
            <p class="etiqueta">SEU CANTINHO VERDE</p>
            <h1>Plantas que deixam a vida mais leve.</h1>
            <p>Cadastre e consulte as plantas do catálogo RAIZ.</p>
        </section>
        <section class="painel">
            <p class="etiqueta">CATÁLOGO</p>
            <h2>Cadastrar uma planta</h2>
            <form id="form-produto">
                <label for="nome">Nome da planta</label>
                <input id="nome" name="nome" type="text" placeholder="Ex.: Jiboia" required>
                <div class="campos-duplos">
                    <div>
                        <label for="preco">Preço (R$)</label>
                        <input id="preco" name="preco" type="number" min="0.01" step="0.01" placeholder="29.90" required>
                    </div>
                    <div>
                        <label for="categoria">Categoria</label>
                        <input id="categoria" name="categoria" type="text" placeholder="Ex.: Meia-sombra" required>
                    </div>
                </div>
                <button type="submit">Cadastrar planta</button>
                <p id="mensagem" role="status"></p>
            </form>
        </section>
        <section class="catalogo">
            <div class="titulo-secao">
                <div><p class="etiqueta">NOSSAS PLANTAS</p><h2>Catálogo de produtos</h2></div>
                <button id="atualizar" class="botao-secundario" type="button">Atualizar lista</button>
            </div>
            <div id="lista-produtos" class="lista-produtos"><p>Carregando produtos...</p></div>
        </section>
    </main>
    <footer>RAIZ — Ateliê de Plantas</footer>
</body>
</html>
